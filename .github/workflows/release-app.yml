name: Release Desktop Application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugins
        run: node scripts/build-plugins.mjs

      - name: Build and Package macOS Universal DMG
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg

      - name: Archive .app bundle
        run: |
          cd bin
          tar -czf bowerbird-macos-universal.app.tar.gz bowerbird.app
          mv bowerbird.dmg bowerbird-macos-universal.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            bin/bowerbird-macos-universal.dmg
            bin/bowerbird-macos-universal.app.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Tools
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          $goBin = "$(go env GOPATH)\bin"
          echo "$goBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugins
        run: node scripts/build-plugins.mjs

      - name: Build and Package Windows Installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;C:\Program Files\NSIS;$env:PATH"
          wails3 task windows:package ARCH=amd64

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          mkdir -p dist-win
          if (Test-Path "build/windows/nsis/bowerbird-installer.exe") {
            cp "build/windows/nsis/bowerbird-installer.exe" "dist-win/bowerbird-windows-x64-installer.exe"
          }
          if (Test-Path "bin/bowerbird.exe") {
            cp "bin/bowerbird.exe" "dist-win/bowerbird-windows-x64-portable.exe"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-win/*

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install -tags exp github.com/wailsapp/wails/v3/cmd/wails3@latest || go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugins
        run: node scripts/build-plugins.mjs

      - name: Build and Package Linux
        run: |
          wails3 task linux:package ARCH=amd64

      - name: Prepare Linux Artifacts
        run: |
          mkdir -p dist-linux
          find bin -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} dist-linux/ \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-linux/*

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Artifacts
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
